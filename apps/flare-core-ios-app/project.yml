# xcodegen spec — wraps the SwiftPM FlareImApp package into a runnable iOS app target.
# Generate:  xcodegen generate   (after scripts/sync_ffi.sh)
# Build sim: xcodebuild -project FlareImApp.xcodeproj -scheme FlareImExampleApp \
#              -destination 'platform=iOS Simulator,name=iPhone 17' build
#
# FFI: the iOS NativeLibraryLoader resolves the C-ABI via dlopen(nil), so the static
# slice must be (1) force-loaded (kept past dead-strip) and (2) export_dynamic (in the
# dynamic symbol table so dlsym finds it).
name: FlareImApp
options:
  bundleIdPrefix: com.flare.im.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # One version for the app and its notification service extension: an extension without CFBundleVersion, or
    # with one that differs from the app's, does not install. The update center compares CFBundleVersion as the
    # build number and checks for nothing without one.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FlareImApp:
    path: .
  # The notification service extension links FlareNotificationService alone (no engine, no FFI).
  FlareCoreIOSPush:
    path: ../../../flare-commercial-client-runtime/packages/push/flare-core-ios-push

targets:
  FlareImExampleApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FlareImAppRunner
    dependencies:
      - package: FlareImApp
        product: FlareImApp
      - target: NotificationService
    # Push Notifications capability. The APNs environment is read at run time from the embedded provisioning profile
    # (development registers as sandbox; a distribution export rewrites this key to production). The App Group is
    # shared with NotificationService: the engine writes the notification snapshot there and the extension appends
    # arrival receipts (PushNotifications passes the same identifier to the push module).
    entitlements:
      path: Resources/FlareImApp.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.flare.im.example.app]
    # "Save" writes pictures, videos and files to Documents/flare (the core's iOS download location). These two
    # keys put the app's Documents in the Files app (On My iPhone › FlareIM), where the person finds them. They
    # have no INFOPLIST_KEY_* build setting, so they live in this partial Info.plist; the generated one keeps the rest.
    info:
      path: Resources/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Access configuration (AppAccess): the whole `access` object, or the development endpoints of a debug build.
        # Empty keys take the local stack's ports in AppAccess.LocalDevelopment.
        FLARE_CORE_ENDPOINTS_JSON: $(FLARE_CORE_ENDPOINTS_JSON)
        FLARE_DEV_WS_URL: $(FLARE_DEV_WS_URL)
        FLARE_DEV_QUIC_URL: $(FLARE_DEV_QUIC_URL)
        FLARE_DEV_CORE_API_URL: $(FLARE_DEV_CORE_API_URL)
        FLARE_DEV_MEDIA_URL: $(FLARE_DEV_MEDIA_URL)
        # What the release manifest is picked by (AppAccess.updateApp). An empty distribution is left to the App Store receipt.
        FLARE_UPDATE_CHANNEL: $(FLARE_UPDATE_CHANNEL)
        FLARE_UPDATE_DISTRIBUTION: $(FLARE_UPDATE_DISTRIBUTION)
        # Silent pushes (`content-available`) run app code: the push module hands them to the core for a short wake.
        # `fetch` lets the push module's background refresh task (BGAppRefreshTask) prefetch new messages.
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.flare.im.example.app.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flare.im.example.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: FlareIM
        INFOPLIST_KEY_NSMicrophoneUsageDescription: FlareIM needs microphone access to record and send voice messages.
        ONLY_ACTIVE_ARCH: "YES"
        SWIFT_VERSION: "6.0"
        # Debug builds run on development endpoints: set any of these to override the local default, for example
        # `xcodebuild ... FLARE_DEV_WS_URL=ws://192.168.1.20:60051`. A release build reads only FLARE_CORE_ENDPOINTS_JSON (its
        # production access configuration) and stops at launch without one.
        FLARE_CORE_ENDPOINTS_JSON: ""
        FLARE_DEV_WS_URL: ""
        FLARE_DEV_QUIC_URL: ""
        FLARE_DEV_CORE_API_URL: ""
        FLARE_DEV_MEDIA_URL: ""
        FLARE_UPDATE_CHANNEL: stable
        FLARE_UPDATE_DISTRIBUTION: ""
        # Select the Rust target for the SDK and current architecture being linked.
        FLARE_CORE_FFI_ROOT: $(PROJECT_DIR)/FFI
        "FLARE_FFI_TARGET[sdk=iphoneos*][arch=arm64]": aarch64-apple-ios
        "FLARE_FFI_TARGET[sdk=iphonesimulator*][arch=arm64]": aarch64-apple-ios-sim
        "FLARE_FFI_TARGET[sdk=iphonesimulator*][arch=x86_64]": x86_64-apple-ios
        # dlopen(nil)+dlsym needs force_load + export_dynamic.
        OTHER_LDFLAGS:
          - -force_load
          - $(FLARE_CORE_FFI_ROOT)/ios/$(FLARE_FFI_TARGET)/libflare_im_core_sdk_ffi.a
          - -Xlinker
          - -export_dynamic

  # Notification service extension (FlareNotificationServiceBase): re-renders alert titles and sender names from the
  # snapshot in the App Group and records arrival receipts. With it the push module registers the `serviceExtension`
  # capability, so the server marks alert pushes `mutable-content`.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: FlareCoreIOSPush
        product: FlareNotificationService
    entitlements:
      path: Resources/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.com.flare.im.example.app]
    info:
      path: Resources/NotificationServiceInfo.plist
      properties:
        CFBundleDisplayName: FlareIM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flare.im.example.app.NotificationService
        GENERATE_INFOPLIST_FILE: "YES"
        ONLY_ACTIVE_ARCH: "YES"
        SWIFT_VERSION: "6.0"
