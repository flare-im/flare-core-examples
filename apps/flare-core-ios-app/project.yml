# xcodegen spec — wraps the SwiftPM FlareImApp package into a runnable iOS app target.
# Generate:  xcodegen generate   (after scripts/sync_ffi.sh)
# Build sim: xcodebuild -project FlareImApp.xcodeproj -scheme FlareImExampleApp \
#              -destination 'platform=iOS Simulator,name=iPhone 17' build
#
# FFI: the iOS NativeLibraryLoader resolves the C-ABI via dlopen(nil), so the static
# slice must be (1) force-loaded (kept past dead-strip) and (2) export_dynamic (in the
# dynamic symbol table so dlsym finds it).
name: FlareImApp
options:
  bundleIdPrefix: com.flare.im.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  FlareImApp:
    path: .

targets:
  FlareImExampleApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FlareImAppRunner
    dependencies:
      - package: FlareImApp
        product: FlareImApp
    # "Save" writes pictures, videos and files to Documents/flare (the core's iOS download location). These two
    # keys put the app's Documents in the Files app (On My iPhone › FlareIM), where the person finds them. They
    # have no INFOPLIST_KEY_* build setting, so they live in this partial Info.plist; the generated one keeps the rest.
    info:
      path: Resources/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Recovery link `flare-recover://v1?…`: imported in either sign-in state (RootWorkbenchView).
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.flare.im.recovery
            CFBundleURLSchemes: [flare-recover]
        # Access configuration (AppAccess): the whole `access` object, or the development endpoints of a debug build.
        # Empty keys take the local stack's ports in AppAccess.LocalDevelopment.
        FLARE_ACCESS_JSON: $(FLARE_ACCESS_JSON)
        FLARE_DEV_WS_URL: $(FLARE_DEV_WS_URL)
        FLARE_DEV_QUIC_URL: $(FLARE_DEV_QUIC_URL)
        FLARE_DEV_CORE_API_URL: $(FLARE_DEV_CORE_API_URL)
        FLARE_DEV_MEDIA_URL: $(FLARE_DEV_MEDIA_URL)
        # What the release manifest is picked by (AppAccess.updateApp). An empty distribution is left to the App Store receipt.
        FLARE_UPDATE_CHANNEL: $(FLARE_UPDATE_CHANNEL)
        FLARE_UPDATE_DISTRIBUTION: $(FLARE_UPDATE_DISTRIBUTION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flare.im.example.app
        # Info.plist takes these; the update center compares CFBundleVersion as the build number and checks
        # for nothing without one.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: FlareIM
        INFOPLIST_KEY_NSMicrophoneUsageDescription: FlareIM needs microphone access to record and send voice messages.
        ONLY_ACTIVE_ARCH: "YES"
        SWIFT_VERSION: "6.0"
        # Debug builds run on development endpoints: set any of these to override the local default, for example
        # `xcodebuild ... FLARE_DEV_WS_URL=ws://192.168.1.20:60051`. A release build reads only FLARE_ACCESS_JSON (its
        # production access configuration) and stops at launch without one.
        FLARE_ACCESS_JSON: ""
        FLARE_DEV_WS_URL: ""
        FLARE_DEV_QUIC_URL: ""
        FLARE_DEV_CORE_API_URL: ""
        FLARE_DEV_MEDIA_URL: ""
        FLARE_UPDATE_CHANNEL: stable
        FLARE_UPDATE_DISTRIBUTION: ""
        # Select the Rust target for the SDK and current architecture being linked.
        "FLARE_FFI_TARGET[sdk=iphoneos*][arch=arm64]": aarch64-apple-ios
        "FLARE_FFI_TARGET[sdk=iphonesimulator*][arch=arm64]": aarch64-apple-ios-sim
        "FLARE_FFI_TARGET[sdk=iphonesimulator*][arch=x86_64]": x86_64-apple-ios
        # dlopen(nil)+dlsym needs force_load + export_dynamic.
        OTHER_LDFLAGS:
          - -force_load
          - $(PROJECT_DIR)/FFI/ios/$(FLARE_FFI_TARGET)/libflare_im_core_sdk_ffi.a
          - -Xlinker
          - -export_dynamic
