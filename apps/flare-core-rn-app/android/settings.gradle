pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'FlareCoreRnApp'
include ':app'
include ':flare-core-android-sdk'
project(':flare-core-android-sdk').projectDir = new File(settingsDir, '../../../../flare-core-sdk/packages/flare-core-android-sdk')
include ':flare-core-android-lifecycle'
project(':flare-core-android-lifecycle').projectDir = new File(settingsDir, '../../../../flare-core-sdk/packages/flare-core-android-sdk/platform-lifecycle')
include ':flare-core-android-push'
project(':flare-core-android-push').projectDir = new File(settingsDir, '../../../../flare-commercial-client-runtime/packages/push/flare-core-android-push')
includeBuild('../node_modules/@react-native/gradle-plugin')
