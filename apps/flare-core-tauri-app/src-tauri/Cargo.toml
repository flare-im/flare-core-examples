[package]
name = "flare-core-tauri-app"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
flare-im-core-sdk-tauri = { path = "../../../../flare-core-sdk-engine/bindings/tauri", features = ["quic"] }
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.4"
# tauri.conf.json 的 plugins 段由 generate_context! 展开成 serde_json 调用。
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
