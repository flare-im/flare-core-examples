name: flare_core_demo
description: A standalone Flutter client for Flare IM Core.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flare_core_flutter_sdk:
    path: .flare/sources/flare-core-sdk/packages/flare-core-flutter-sdk
  flare_im_ui:
    path: .flare/sources/flare-im-design/packages/flutter-im-ui
  path_provider: ^2.1.5
  file_picker: ^8.3.7

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
